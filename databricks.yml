# Databricks Asset Bundle: Project 1 — YouTube restaurant search app + Kimball medallion pipeline.
#   databricks bundle validate --strict            # dev (default)
#   databricks bundle deploy                       # dev: prod.dev_* schemas, "[dev]" job, schedule paused
#   databricks bundle deploy -t prod               # prod: prod.bronze / silver / gold, real names
# Cloud threads deploy dev as the service principal claude-deploy (guide:
# project files project1/deploy-service-principal-guide.md).
#
# dev does not use `mode: development`: that mode renames UC schemas to dev_<user>_*, and dev
# should write to prod.dev_bronze / prod.dev_silver / prod.dev_gold (same catalog as prod).
bundle:
  name: project1_youtube_restaurants

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog holding the bronze / silver / gold schemas
    default: prod
  schema_prefix:
    description: Prefix of the bronze / silver / gold schema names (dev_ in dev, empty in prod)
    default: dev_
  job_name_prefix:
    description: Prefix of the job name, so dev and prod jobs are easy to tell apart
    default: "[dev] "
  warehouse_id:
    description: SQL warehouse the app uses to read Gold
    lookup:
      warehouse: Serverless Starter Warehouse
  app_name:
    description: "App name: lowercase letters, digits, and hyphens; maximum 30 characters"
    default: yt-search-${workspace.current_user.domain_friendly_name}
  dry_run:
    description: "true = refresh and search call the APIs but write nothing to Postgres. Default false (datle 31/10); set true only to test a new feature (dev and prod share one Lakebase)"
    default: "false"
  search_keyword:
    description: Default keyword of the on-demand search job (project1_search)
    default: "quán ăn Hồ Chí Minh"
  search_max_results:
    description: "Default number of results of the search job (youtube 1-50, places 1-60)"
    default: "10"
  search_order:
    description: "Default YouTube sort order of the search job: relevance, date, or viewCount"
    default: relevance
  auto_search_count:
    description: "Keywords the daily auto_search task searches on YouTube (100 units each; free quota 10,000 / day)"
    default: "20"
  auto_search_max_results:
    description: Results per auto_search keyword (1-50)
    default: "25"
  auto_places_count:
    description: "Google Maps keywords auto_search searches per day (1 Text Search Pro call each; Pro calls capped at 1,500 / month)"
    default: "40"
  auto_channel_limit:
    description: "Followed food channels whose new uploads auto_search lists per day (playlistItems.list, 1 unit each)"
    default: "100"
  comments_max_videos:
    description: "Food review videos whose comments fetch_comments downloads per day (commentThreads.list, 1 unit each)"
    default: "200"
  schedule_pause_status:
    description: PAUSED or UNPAUSED for the daily schedule
    default: PAUSED
  notification_email:
    description: Who gets the job failure email
    default: ${workspace.current_user.userName}

targets:
  dev:
    default: true
    variables:
      # Daily run on (datle 31/10: auto search runs every day on dev)
      schedule_pause_status: UNPAUSED
      # Fixed to datle (not ${workspace.current_user...}) so a deploy by the service principal
      # claude-deploy (cloud threads, later GitHub Actions) updates the same app, not a new one.
      app_name: yt-search-lemanhdat2112
      notification_email: lemanhdat2112@gmail.com
    workspace:
      host: https://dbc-66b44822-7fe7.cloud.databricks.com
      # Fixed to datle's folder: the bundle state lives here, so datle and claude-deploy deploy
      # the same jobs / dashboard / app instead of each creating their own copy.
      root_path: /Workspace/Users/lemanhdat2112@gmail.com/.bundle/${bundle.name}/${bundle.target}
    # Applied to the bundle folder and to every job, dashboard, and app of this target, on top of
    # the per-job permissions below. datle stays owner, so the jobs keep running as datle.
    permissions:
      - user_name: lemanhdat2112@gmail.com
        level: CAN_MANAGE
      - service_principal_name: 10d899a3-f900-4242-be6c-2922da0bb0cb  # claude-deploy (cloud deploy, CI/CD)
        level: CAN_MANAGE
    resources:
      jobs:
        project1_search:
          # The bundle owns this ACL, so list everyone who runs the job (see project1_search.job.yml).
          permissions:
            - user_name: lemanhdat2112@gmail.com  # stays owner, so the job runs as datle whoever deploys
              level: IS_OWNER
            - service_principal_name: 634b1634-89b6-4ff7-a0ac-e32e87f5d382  # claude-search (Claude chat)
              level: CAN_MANAGE_RUN
            - service_principal_name: b5dc6edb-27c3-4bbe-9f47-c4e589402af0  # app yt-search-<user> (Search ingest page)
              level: CAN_MANAGE_RUN
        project1_daily:
          # claude-search runs the end-to-end pipeline from the Claude chat (dev only)
          permissions:
            - user_name: lemanhdat2112@gmail.com  # stays owner, so the job runs as datle whoever deploys
              level: IS_OWNER
            - service_principal_name: 634b1634-89b6-4ff7-a0ac-e32e87f5d382  # claude-search (Claude chat)
              level: CAN_MANAGE_RUN
        project1_stats_refresh:
          # claude-search can run the intraday stats refresh from the Claude chat (dev only)
          permissions:
            - user_name: lemanhdat2112@gmail.com  # stays owner, so the job runs as datle whoever deploys
              level: IS_OWNER
            - service_principal_name: 634b1634-89b6-4ff7-a0ac-e32e87f5d382  # claude-search (Claude chat)
              level: CAN_MANAGE_RUN

  prod:
    mode: production
    workspace:
      host: https://dbc-66b44822-7fe7.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      schema_prefix: ""
      job_name_prefix: ""
      app_name: youtube-restaurant-search
      # Set to UNPAUSED once the secret youtube/api_key exists and a dry run passed.
      schedule_pause_status: PAUSED
    resources:
      jobs:
        project1_search:
          # Add the prod app's service principal here once the prod app exists.
          permissions:
            - service_principal_name: 634b1634-89b6-4ff7-a0ac-e32e87f5d382  # claude-search (Claude chat)
              level: CAN_MANAGE_RUN
