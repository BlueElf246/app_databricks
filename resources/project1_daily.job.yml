# Daily medallion job (design 1.5 "Daily job order"). Each task depends on the previous step,
# so a failure (empty-source guard, Gold checks) stops everything after it.
resources:
  jobs:
    project1_daily:
      name: ${var.job_name_prefix}Project 1 — YouTube restaurants medallion (daily)
      description: >-
        auto_search → refresh → fetch_comments → Bronze → Silver → Gold dims → facts → checks → agg_restaurant_daily_views → agg_restaurant_ranking.
        osm_ingest (weekly OpenStreetMap snapshot, skipped on the other days) → stg_osm_restaurants feeds gold_restaurants.
        Design: Notion "Redesign Project 1 data model with Kimball" 1.5.
      schedule:
        quartz_cron_expression: "0 0 1 * * ?"
        timezone_id: Asia/Ho_Chi_Minh
        pause_status: ${var.schedule_pause_status}
      max_concurrent_runs: 1
      timeout_seconds: 7200
      email_notifications:
        on_failure:
          - ${var.notification_email}
      tags:
        project: project1
        layer: medallion
      parameters:
        - name: bronze
          default: ${var.catalog}.${resources.schemas.bronze.name}
        - name: silver
          default: ${var.catalog}.${resources.schemas.silver.name}
        - name: gold
          default: ${var.catalog}.${resources.schemas.gold.name}
        - name: dry_run
          default: ${var.dry_run}
        - name: auto_search_count
          default: ${var.auto_search_count}
        - name: auto_search_max_results
          default: ${var.auto_search_max_results}
        - name: auto_channel_limit
          default: ${var.auto_channel_limit}
        - name: auto_places_count
          default: ${var.auto_places_count}
        - name: comments_max_videos
          default: ${var.comments_max_videos}
      tasks:
        # Source A first: new uploads of followed food channels (1 unit per channel), then the
        # system picks ~20 keywords and searches YouTube (design "Tự động search keyword");
        # never fails, so refresh always runs. New videos flow through the rest of this run.
        - task_key: auto_search
          notebook_task:
            notebook_path: ../src/notebooks/refresh/auto_search.ipynb
            base_parameters:
              databricks_run_id: "{{job.run_id}}"
          timeout_seconds: 1800

        - task_key: refresh_daily
          depends_on: [{task_key: auto_search}]
          notebook_task:
            notebook_path: ../src/notebooks/refresh/run_refresh.ipynb
          timeout_seconds: 1800

        # Keyword search (YouTube / Google Places) is not part of the daily run: it is the
        # on-demand job project1_search (project1_search.job.yml); its rows land here on the next run.
        # Top 100 comments of food review videos (1 unit per video, at most comments_max_videos per run,
        # each video again after 30 days); never fails, so Bronze always runs.
        - task_key: fetch_comments
          depends_on: [{task_key: refresh_daily}]
          notebook_task:
            notebook_path: ../src/notebooks/refresh/fetch_comments.ipynb
          timeout_seconds: 1800

        # OpenStreetMap food places in HCMC (one Overpass query per week, skipped on other days; never fails).
        # Runs in parallel with the YouTube tasks; stg_osm_restaurants fills cuisine / opening hours in gold_restaurants.
        - task_key: osm_ingest
          notebook_task:
            notebook_path: ../src/notebooks/bronze/osm_ingest.ipynb
          timeout_seconds: 900

        - task_key: stg_osm_restaurants
          depends_on: [{task_key: osm_ingest}]
          notebook_task:
            notebook_path: ../src/notebooks/stg/osm_restaurants.ipynb
          timeout_seconds: 900

        - task_key: bronze_ingest
          depends_on:
            - task_key: refresh_daily
            - task_key: fetch_comments
          notebook_task:
            notebook_path: ../src/notebooks/bronze/ingest_raw.ipynb
          timeout_seconds: 1800

        - task_key: stg_channels
          depends_on: [{task_key: bronze_ingest}]
          notebook_task:
            notebook_path: ../src/notebooks/stg/channels.ipynb
          timeout_seconds: 1800

        - task_key: stg_videos
          depends_on: [{task_key: bronze_ingest}]
          notebook_task:
            notebook_path: ../src/notebooks/stg/videos.ipynb
          timeout_seconds: 1800

        - task_key: stg_comments
          depends_on: [{task_key: bronze_ingest}]
          notebook_task:
            notebook_path: ../src/notebooks/stg/comments.ipynb
          timeout_seconds: 1800

        - task_key: stg_search_results
          depends_on: [{task_key: bronze_ingest}]
          notebook_task:
            notebook_path: ../src/notebooks/stg/search_results.ipynb
          timeout_seconds: 1800

        # Google Maps Text Search results (search job + auto_search mode places) -> Google-only restaurants
        - task_key: stg_places
          depends_on: [{task_key: bronze_ingest}]
          notebook_task:
            notebook_path: ../src/notebooks/stg/places.ipynb
          timeout_seconds: 1800

        # LLM video type (restaurant_review / food_other / not_food) of new or changed videos;
        # is_food_review = false (confident not_food) makes transcripts and restaurant extraction skip a video
        - task_key: stg_video_classification
          depends_on: [{task_key: stg_videos}]
          notebook_task:
            notebook_path: ../src/notebooks/stg/video_classification.ipynb
          timeout_seconds: 1800

        # Gemini transcript of new videos (free tier: at most 7 h of video per day, max_videos calls per run)
        - task_key: stg_video_transcripts
          depends_on: [{task_key: gold_dims}]
          notebook_task:
            notebook_path: ../src/notebooks/stg/video_transcripts.ipynb
            base_parameters:
              max_videos: "20"
          timeout_seconds: 3600

        - task_key: stg_restaurant_mentions
          depends_on:
            - task_key: stg_videos
            - task_key: stg_video_transcripts
          notebook_task:
            notebook_path: ../src/notebooks/stg/restaurant_mentions.ipynb
          timeout_seconds: 1800

        # Google Places lookup of new restaurants (cached; at most 200 API calls per run)
        - task_key: stg_restaurant_geocode
          depends_on: [{task_key: stg_restaurant_mentions}]
          notebook_task:
            notebook_path: ../src/notebooks/stg/restaurant_geocode.ipynb
          timeout_seconds: 1800

        # Google Place Details (rating, price range, cuisine type, website, phone, opening hours, photo, up to
        # 5 reviews) of matched places (re-read every 30 days), then of Google-only places that auto_search found
        # with Text Search Pro (stg_places, re-read every 90 days); capped under the free calls per month
        - task_key: stg_restaurant_place_details
          depends_on:
            - task_key: stg_restaurant_geocode
            - task_key: stg_places
          notebook_task:
            notebook_path: ../src/notebooks/stg/restaurant_place_details.ipynb
          timeout_seconds: 1800

        - task_key: gold_dims
          depends_on:
            - task_key: stg_channels
            - task_key: stg_videos
            - task_key: stg_comments
            - task_key: stg_search_results
            - task_key: stg_video_classification
          notebook_task:
            notebook_path: ../src/notebooks/gold/dims.ipynb
          timeout_seconds: 1800

        - task_key: gold_facts
          depends_on: [{task_key: gold_dims}]
          notebook_task:
            notebook_path: ../src/notebooks/gold/facts.ipynb
          timeout_seconds: 1800

        - task_key: gold_restaurants
          depends_on:
            - task_key: gold_dims
            - task_key: stg_restaurant_place_details
            - task_key: stg_places
            - task_key: stg_osm_restaurants
          notebook_task:
            notebook_path: ../src/notebooks/gold/restaurants.ipynb
          timeout_seconds: 1800

        - task_key: gold_checks
          depends_on:
            - task_key: gold_facts
            - task_key: gold_restaurants
          notebook_task:
            notebook_path: ../src/notebooks/gold/checks.ipynb
          timeout_seconds: 1800

        # Restaurant x day credited views gained (7-day trending input of agg_restaurant_ranking)
        - task_key: gold_agg_daily_views
          depends_on: [{task_key: gold_checks}]
          notebook_task:
            notebook_path: ../src/notebooks/gold/agg_restaurant_daily_views.ipynb
          timeout_seconds: 1800

        # LLM sentiment of comments on food review videos that mention a restaurant (most liked first, capped per run)
        - task_key: stg_comment_sentiment
          depends_on:
            - task_key: stg_comments
            - task_key: stg_restaurant_mentions
            - task_key: stg_video_classification
          notebook_task:
            notebook_path: ../src/notebooks/stg/comment_sentiment.ipynb
            base_parameters:
              max_comments: "5000"
          timeout_seconds: 3600

        # Restaurant x comment (split credit) with sentiment, for agg_restaurant_ranking and the dashboard
        - task_key: gold_agg_comments
          depends_on:
            - task_key: gold_checks
            - task_key: stg_comment_sentiment
          notebook_task:
            notebook_path: ../src/notebooks/gold/agg_restaurant_comments.ipynb
          timeout_seconds: 1800

        - task_key: gold_agg_ranking
          depends_on:
            - task_key: gold_agg_daily_views
            - task_key: gold_agg_comments
          notebook_task:
            notebook_path: ../src/notebooks/gold/agg_restaurant_ranking.ipynb
          timeout_seconds: 1800

        # Always runs (even after a failure): row counts + top 10 as JSON in the run output,
        # so a chat session can review the run via the Jobs API (runs/get-output).
        - task_key: run_summary
          depends_on: [{task_key: gold_agg_ranking}]
          run_if: ALL_DONE
          notebook_task:
            notebook_path: ../src/notebooks/gold/run_summary.ipynb
          timeout_seconds: 900
