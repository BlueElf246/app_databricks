# Streamlit app (src/app). The run command and env vars live in `config` below (2026-11-08: moved from
# src/app/app.yaml so the Postgres schema and the serving schema follow the target); value_from names refer
# to the app resources.
resources:
  apps:
    youtube_search:
      name: ${var.app_name}
      description: YouTube restaurant search + Gold restaurant ranking (Project 1)
      source_code_path: ../src/app
      resources:
        # Postgres password; READ on the scope also lets youtube_client read youtube/api_key.
        - name: pg-password
          secret:
            scope: youtube
            key: pg_password
            permission: READ
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        # Search ingest page: runs the on-demand search job with the form's parameters
        - name: search-job
          job:
            id: ${resources.jobs.project1_search.id}
            permission: CAN_MANAGE_RUN
      config:
        command:
          - streamlit
          - run
          - app.py
          - --server.port
          - "$DATABRICKS_APP_PORT"
          - --server.address
          - "0.0.0.0"
        env:
          # Lakebase Postgres (project my-database, branch production)
          - name: PGHOST
            value: "ep-still-butterfly-d8fd3r70.database.us-east-2.cloud.databricks.com"
          - name: PGDATABASE
            value: "databricks_postgres"
          - name: PGUSER
            value: "admin"
          - name: PGPASSWORD
            value_from: pg-password
          # Postgres schema of this target: public in dev, prod in prod
          - name: APP_SCHEMA
            value: ${var.pg_schema}
          # Serving tables (agg_*) for the ranking page (YOUTUBE_API_KEY is read from secret youtube/api_key)
          - name: DATABRICKS_WAREHOUSE_ID
            value_from: sql-warehouse
          - name: SERVING_SCHEMA
            value: ${var.catalog}.${var.schema_prefix}serving
          # Job run by the Search ingest page (resource search-job above)
          - name: SEARCH_JOB_ID
            value_from: search-job
